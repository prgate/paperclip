name: PRGate Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    name: AI Code Review

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install PRGate
        env:
          GH_TOKEN: ${{ secrets.PRGATE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add PRGATE_REPO_TOKEN to repo secrets (PAT with repo scope for prgate/prgate)"
            exit 1
          fi
          pip install "git+https://x-access-token:${GH_TOKEN}@github.com/prgate/prgate.git@main"

      - name: Run PRGate review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: .prgate.yaml
          POLICY_PATH: org-policy.yaml
          LLM_PROVIDER: anthropic
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: prgate run

      - name: Comment PR if review failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ PRGate review encountered an error. Please check the workflow logs.'
            })
